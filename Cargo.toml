[workspace]
members = [".", "crates/micro-glancer-core"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

# The Python package micro-glancer (module micro_glancer, its native part
# micro_glancer._core): a GPU viewer for OME-Zarr images on a Rust core (Workplan WP14).
# The work lives in the crate micro-glancer-core, which knows nothing about Python or Qt;
# this crate only binds it.
[package]
name = "micro-glancer"
version = "0.0.2"
edition.workspace = true
license.workspace = true
publish = false
description = "A GPU viewer for OME-Zarr images: micro-glancer-core bound for Python and hosted in Qt"

[lib]
name = "micro_glancer_core_py"
crate-type = ["cdylib"]

[dependencies]
# abi3: one wheel per platform for every Python >= 3.11
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
micro-glancer-core = { path = "crates/micro-glancer-core" }
raw-window-handle = "0.6"

[profile.release]
lto = true
codegen-units = 1
