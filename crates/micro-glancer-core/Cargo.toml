[package]
name = "micro-glancer-core"
version = "0.0.2"
edition.workspace = true
license.workspace = true
publish = false
description = "micro-glancer's core: GPU rendering of OME-Zarr images from a tile cache, read through ome-zarr-pyramid and dyna-zarr's arrays (Workplan WP14)"

[dependencies]
# rendering: Vulkan, Metal, DX12, GL, and software adapters (WARP, lavapipe)
wgpu = "30"
raw-window-handle = "0.6"
# waiting for the adapter and device (wgpu's requests are futures)
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
# the view state as JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ozp in Rust (DR9): images, levels and their matrices. A commit of ozp's pull request
# #21 (branch dr9-rust-core), which stays in main's history once merged with a merge
# commit. To build against a local ozp checkout instead, add to .cargo/config.toml:
#   [patch."https://github.com/Euro-BioImaging/ome_zarr_pyramid"]
#   ome-zarr-pyramid = { path = "<ozp>/core/crates/ome-zarr-pyramid" }
ome-zarr-pyramid = { git = "https://github.com/Euro-BioImaging/ome_zarr_pyramid", rev = "bd73e58a91c5805edeaf5fbe35a94dc65908bd57" }
# tiles are region reads of dyna's engine arrays: the commit ozp's core pins
dyna-zarr-arrays = { git = "https://github.com/bugraoezdemir/dyna_zarr", rev = "8699f9b34a5bee5e550e7c436b65cf9de6aa99f7" }
# scene transformations (NGFF 0.6 positions): the same commit
dyna-zarr-transforms = { git = "https://github.com/bugraoezdemir/dyna_zarr", rev = "8699f9b34a5bee5e550e7c436b65cf9de6aa99f7" }
