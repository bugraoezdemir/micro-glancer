name: Tests

# Tests run in two places: on a pull request (when it is opened, on every new commit,
# when it is reopened) and before every release (publish.yml calls this workflow;
# nothing is published unless it passes). Plain pushes do not run them; the
# "Run workflow" button on the Actions tab runs them by hand.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_call:

concurrency:
  # A new commit on the same PR cancels its run still in progress (not releases).
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cargo test leaves out the binding (micro-glancer): it has no Rust tests, and its
      # test program cannot link on macOS, where an extension module finds Python's
      # symbols only when Python loads it. The Python tests below test it.
      - name: format, lint, test (toolchain from rust-toolchain.toml)
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --exclude micro-glancer --locked

  licences:
    name: licence notices current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: regenerate THIRD_PARTY_LICENSES.txt and compare
        run: |
          cargo fetch --locked
          python3 scripts/third_party_licenses.py
          git diff --exit-code THIRD_PARTY_LICENSES.txt

  build:
    uses: ./.github/workflows/build-wheels.yml

  test:
    # The tests run on the wheels just built (not the source tree), so a module left
    # out of the wheel fails here. Runners have no GPU: Linux draws with Mesa's
    # lavapipe (a Vulkan driver on the CPU), Windows with WARP (DX12 on the CPU),
    # macOS with the runner's Metal device.
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11", wheel: linux-x86_64 }
          - { os: ubuntu-latest, python: "3.13", wheel: linux-x86_64 }
          - { os: windows-latest, python: "3.12", wheel: windows-x64 }
          - { os: macos-latest, python: "3.13", wheel: macos-arm64 }
    env:
      QT_QPA_PLATFORM: offscreen          # Qt without a display
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Linux libraries (lavapipe, and what PyQt6 needs off screen)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.wheel }}
          path: dist

      - name: Install the wheel with Qt, ome_zarr_pyramid and pytest
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # the wheel file itself (with --find-links, pip could take a PyPI copy instead)
          python -m pip install "$(ls dist/*.whl)[dev]"
          python -c "import micro_glancer as m; print(m.__file__); assert 'site-packages' in m.__file__, 'not the installed wheel'"

      - name: pytest
        # an error Python could not raise (a viewer dropped on another thread, which
        # leaks it) fails the run instead of passing as a warning
        run: python -m pytest tests -v -o addopts="" -W error::pytest.PytestUnraisableExceptionWarning
