name: Publish to PyPI

# Runs when you publish a GitHub Release (Releases -> Draft a new release -> Publish):
#
#   1. the release tag must equal the version (vX.Y.Z), which is the binding crate's
#      in Cargo.toml (pyproject.toml takes it from there);
#   2. the full test suite runs on the release's commit (tests.yml, which also builds
#      the wheels and the sdist); nothing is published unless it passes;
#   3. the wheels and the sdist built by tests.yml are uploaded to PyPI through
#      Trusted Publishing (OIDC): no API token or secret.
#
# If only the upload failed, "Re-run failed jobs" on the run retries it. If the tests
# failed: fix, delete the release and its tag, and release again.
#
# Keep this file's name: the PyPI trusted publisher is registered for publish.yml with
# the environment pypi. One-time setup before the first release: on PyPI, a pending
# publisher for the project micro-glancer (this repository, workflow publish.yml,
# environment pypi); on GitHub, the environment pypi (Settings > Environments).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    name: Tag matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release tag equals Cargo.toml's version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")
          test "v$version" = "${{ github.event.release.tag_name }}" \
            || { echo "::error::release tag ${{ github.event.release.tag_name }} != v$version (Cargo.toml)"; exit 1; }

  tests:
    needs: checks
    uses: ./.github/workflows/tests.yml

  publish:
    name: Publish to PyPI
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/micro-glancer/
    permissions:
      contents: read                      # a permissions block drops the defaults: keep read
      id-token: write                     # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*                # every platform's wheel, built by tests.yml
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Check metadata
        run: |
          python3 -m pip install --upgrade twine
          python3 -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
